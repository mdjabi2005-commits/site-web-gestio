<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion bancaire - Gestio</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 24px;
      }
      a { color: #5b3fa6; font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <p id="status">Retour vers Gestio…</p>
      <p><a id="open" href="gestio://auth/callback">Ouvrir Gestio</a></p>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const target = `gestio://auth/callback?${params.toString()}`;
      const link = document.getElementById("open");
      link.href = target;
      window.location.replace(target);
      setTimeout(() => {
        document.getElementById("status").textContent =
          "Si Gestio ne s’ouvre pas automatiquement, appuyez sur le bouton.";
      }, 1200);
    </script>
  </body>
</html>
